#!/bin/bash
# ============================================================
# TPM 环境变量配置文件
# 所有脚本通过 source 此文件获取统一配置
# ============================================================

# --- TPM 模拟器配置 ---
TPM_SERVER_PORT=2321
TPM_CTRL_PORT=2322
TPM_STATE_DIR="/tmp/tpm-vault-state"

# --- TCTI 配置 ---
# swtpm: 通过 TCP 连接到 swtpm 模拟器 (Ubuntu 22.04 兼容)
export TPM2TOOLS_TCTI="swtpm:host=localhost,port=${TPM_SERVER_PORT}"
export TPM2_PKCS11_TCTI="swtpm:host=localhost,port=${TPM_SERVER_PORT}"

# --- 工作目录 ---
# 演示脚本产生的临时文件存放位置
TPM_WORK_DIR="/tmp/tpm-vault-workdir"

# --- PKCS#11 配置 ---
PKCS11_MODULE="/usr/lib/x86_64-linux-gnu/libtpm2_pkcs11.so"
PKCS11_TOKEN_LABEL="tpm-vault-token"
PKCS11_SO_PIN="sopin123456"
PKCS11_USER_PIN="userpin123456"
export TPM2_PKCS11_STORE="${TPM_WORK_DIR}/pkcs11-store"

# --- 项目根目录 (自动检测) ---
# 从 config/ 目录向上一级
PROJECT_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
